<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Nilesoft Shell Settings logo: a context menu with a highlighted row and a spark.
       src/settings/tools/make_icon.py draws the same shapes for app.ico; keep them in sync. -->
  <defs>
    <linearGradient id="tile" x1="16" y1="16" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38BDF8"/>
