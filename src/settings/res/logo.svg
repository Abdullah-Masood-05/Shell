    </linearGradient>
    <linearGradient id="row" x1="48" y1="0" x2="148" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="224" height="224" rx="56" fill="url(#tile)"/>
  <rect x="42" y="84" width="120" height="128" rx="18" fill="#0B1020" fill-opacity="0.22"/>
  <rect x="38" y="76" width="120" height="128" rx="18" fill="#FFFFFF"/>
  <rect x="56" y="98" width="64" height="14" rx="7" fill="#CBD5E1"/>
