name: Feature request
description: An idea for something new, or for something that could work better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like the app or Shell to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What are you trying to do, and what gets in the way today?
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or examples
      description: Optional. A picture, a sketch or an example from another program.
