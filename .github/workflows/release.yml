name: Release

# Builds everything with build.yml and publishes a GitHub Release for a v* tag with the
# MSIs, the portable zip, the app-only update zip with its update.json, and SHA256SUMS.txt. A tag with a "-" (v2.0.0-beta.1) is
# published as a pre-release. Run it by hand for an existing tag with workflow_dispatch.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release, e.g. v2.0.0-beta.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  meta:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Tag, version and pre-release flag
        id: meta
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a release tag like v2.0.0 or v2.0.0-beta.1"
            exit 1
          fi
          version="${TAG#v}"
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          {
            echo "tag=$TAG"
            echo "version=$version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.meta.outputs.tag }}

      # The MSI's version comes from src/shared/Resource.h (and var.wxi); the tag must match.
      - name: Check the tag against Resource.h
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          get() { sed -nE "s/^#define[[:space:]]+VERSION_$1[[:space:]]+([0-9]+).*/\1/p" src/shared/Resource.h; }
          source_version="$(get MAJOR).$(get MINOR).$(get BUILD)"
          if [[ "${VERSION%%-*}" != "$source_version" ]]; then
            echo "::error::Tag version ${VERSION%%-*} does not match Resource.h ($source_version)"
            exit 1
          fi
          grep -q "Version = '$source_version'" src/setup/wix/var.wxi \
            || { echo "::error::src/setup/wix/var.wxi does not say Version = '$source_version'"; exit 1; }

  build:
    name: Build
    needs: meta
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ needs.meta.outputs.tag }}
      version: ${{ needs.meta.outputs.version }}

  release:
    name: Publish the release
    needs: [ meta, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # The whole history and the tags: update.json compares this release with the one before.
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ needs.meta.outputs.tag }}
          fetch-depth: 0

      - name: Download the MSIs
        uses: actions/download-artifact@v8
        with:
          pattern: msi-*
          path: dist
          merge-multiple: true

      - name: Download the portable zip
        uses: actions/download-artifact@v8
        with:
          name: portable-x64
          path: dist

      # update.json tells the app what this release changes, so an all-users install can
      # update without administrator rights (src/settings/src/Updater.h, AppChannel.h):
      #   app     the app-only zip and the SHA-256 of every file in it;
      #   core    since: the release whose shell.dll and shell.exe sources this one still has
      #           (src/dll, src/exe, src/lib, src/3rdparty, src/shared, version numbers and
      #           the shipped-config hash list aside); the app installs the app-only zip only
      #           over a core at least that new, else it offers the MSI (administrator approval);
      #   config  the same for shell.nss and imports\ (delivered per user by the app).
      # "since" carries over from the previous release's update.json; a previous release
      # without one counts as its own "since" (it may have changed things: the safe side).
      - name: update.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          app_zip="NilesoftShellPro-$VERSION-x64-app.zip"
          [[ -f "dist/$app_zip" ]] || { echo "::error::$app_zip is missing"; exit 1; }

          prev="$(git -c versionsort.suffix=- tag --list 'v*' --sort=-v:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
                  | awk -v cur="$TAG" 'found { print; exit } $0 == cur { found = 1 }')"
          core_changed=true
          config_changed=true
          core_since="$VERSION"
          config_since="$VERSION"
          if [[ -n "$prev" ]]; then
            echo "Previous release: $prev"
            resource="$(git diff "$prev" "$TAG" -- src/shared/Resource.h | grep -E '^[-+][^-+]' | grep -vE 'VERSION' || true)"
            if git diff --quiet "$prev" "$TAG" -- src/dll src/exe src/lib src/3rdparty src/shared \
                 ':(exclude)src/shared/Resource.h' ':(exclude)src/shared/ShippedConfigHashes.inc' \
               && [[ -z "$resource" ]]; then
              core_changed=false
            fi
            git diff --quiet "$prev" "$TAG" -- src/bin/shell.nss src/bin/imports && config_changed=false
            rm -rf prev-release
            gh release download "$prev" --repo "$GITHUB_REPOSITORY" -p update.json -D prev-release 2>/dev/null || true
            prev_json="$(cat prev-release/update.json 2>/dev/null || true)"
            rm -rf prev-release
            prev_core="$(jq -r '.core.since // empty' <<<"$prev_json" 2>/dev/null || true)"
            prev_config="$(jq -r '.config.since // empty' <<<"$prev_json" 2>/dev/null || true)"
            [[ "$core_changed" == false ]] && core_since="${prev_core:-${prev#v}}"
            [[ "$config_changed" == false ]] && config_since="${prev_config:-${prev#v}}"
          fi
          echo "core: changed=$core_changed since=$core_since; config: changed=$config_changed since=$config_since"

          rm -rf app-files && mkdir app-files
          unzip -q "dist/$app_zip" -d app-files
          files="$(cd app-files && find . -type f | sed 's|^\./||' | LC_ALL=C sort \
                   | while IFS= read -r f; do printf '%s\t%s\n' "$f" "$(sha256sum "$f" | cut -d' ' -f1)"; done \
                   | jq -Rn '[inputs | split("\t") | { (.[0]): .[1] }] | add')"
          jq -e '."NilesoftShellPro.exe"' <<<"$files" > /dev/null || { echo "::error::$app_zip has no NilesoftShellPro.exe"; exit 1; }
          jq -n --arg version "$VERSION" --arg package "$app_zip" \
                --arg sha "$(sha256sum "dist/$app_zip" | cut -d' ' -f1)" --argjson files "$files" \
                --arg core_since "$core_since" --argjson core_changed "$core_changed" \
                --arg config_since "$config_since" --argjson config_changed "$config_changed" \
            '{ schema: 1, version: $version,
               app: { package: $package, sha256: $sha, minCore: $core_since, files: $files },
               core: { since: $core_since, changed: $core_changed },
               config: { since: $config_since, changed: $config_changed } }' > dist/update.json
          rm -rf app-files
          cat dist/update.json

      - name: SHA256SUMS.txt and release notes
        run: |
          set -euo pipefail
          cd dist
          ls -l
          for f in setup-x64.msi setup-arm64.msi setup-x86.msi "NilesoftShellPro-$VERSION-x64-portable.zip" \
                   "NilesoftShellPro-$VERSION-x64-app.zip" update.json; do
            [[ -f "$f" ]] || { echo "::error::$f is missing"; exit 1; }
          done
          # A copy under a fixed name, so releases/latest/download/NilesoftShellPro-x64-portable.zip
          # always serves the newest portable build (the docs and README link to it).
          cp "NilesoftShellPro-$VERSION-x64-portable.zip" NilesoftShellPro-x64-portable.zip
          sha256sum setup-*.msi NilesoftShellPro-*.zip update.json > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          # Each release lists only its own changes: .github/changes/<X.Y.Z>.md (betas of a
          # version share its file) goes where the template says {{CHANGES}}.
          changes=".github/changes/${VERSION%%-*}.md"
          [[ -f "$changes" ]] || { echo "::error::$changes is missing"; exit 1; }
          awk -v f="$changes" '/^\{\{CHANGES\}\}/ { while ((getline line < f) > 0) print line; next } { print }' .github/release-notes.md | tr -d '\r' \
            | sed -e "s/{{VERSION}}/$VERSION/g" -e "s/{{TAG}}/$TAG/g" > dist/release-notes.md
          grep -q '{{' dist/release-notes.md && { echo "::error::unfilled placeholder in the release notes"; exit 1; } || true

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Nilesoft Shell Pro ${{ needs.meta.outputs.version }}
          body_path: dist/release-notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'true' && 'false' || 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/setup-x64.msi
            dist/setup-arm64.msi
            dist/setup-x86.msi
            dist/NilesoftShellPro-${{ needs.meta.outputs.version }}-x64-portable.zip
            dist/NilesoftShellPro-x64-portable.zip
            dist/NilesoftShellPro-${{ needs.meta.outputs.version }}-x64-app.zip
            dist/update.json
            dist/SHA256SUMS.txt
